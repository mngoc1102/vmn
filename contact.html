<body>
    <header>
        <div id="audio-player" style="text-align: center; margin-bottom: 20px;">
            <button id="toggleMusic" style="background-color:#800080; color: white; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px;">Play Music</button>
            <audio id="backgroundMusic" loop>
                <source src="assets/CanYouHearMyHeartMoonLoversScarletHeartRyoOST-EpikHighLeeHi-4591379.mp3" type="audio/mpeg">
                Your browser does not support audio.
            </audio>
        </div>
        
        <script>
            const toggleMusic = document.getElementById("toggleMusic");
            const backgroundMusic = document.getElementById("backgroundMusic");

            toggleMusic.addEventListener("click", function() {
                if (backgroundMusic.paused) {
                    backgroundMusic.play();
                    toggleMusic.textContent = "Pause Music";
                } else {
                    backgroundMusic.pause();
                    toggleMusic.textContent = "Play Music";
                }
            });
        </script>

    <div class="container">
        <section class="contact-form">
            <h1>Contact Me</h1>
            <form action="submit_form.php" method="post">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name..." required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email..." required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" placeholder="Write your message to me..." required></textarea>

                <button type="submit">Send</button>
